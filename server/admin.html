<!DOCTYPE html>

<html
    lang="ar"
    dir="rtl"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        لوحة تحكم Mafia Online
    </title>

    <style>

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .admin-container {
            max-width: 1200px;
            margin: auto;
        }

        .admin-header {
            margin-bottom: 30px;
        }

        .admin-header h1 {
            margin-bottom: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            padding: 25px;
            border-radius: 18px;
            background: #1e293b;
            text-align: center;
        }

        .stat-card .icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
        }

        .stat-card .label {
            margin-top: 8px;
            color: #94a3b8;
        }

        .suggestions-section {
            background: #1e293b;
            padding: 25px;
            border-radius: 18px;
        }

        .suggestion-card {
            margin-top: 15px;
            padding: 18px;
            border-radius: 14px;
            background: #0f172a;
        }

        .suggestion-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 10px;
        }

        .suggestion-user {
            font-weight: bold;
        }

        .suggestion-date {
            color: #94a3b8;
            font-size: 13px;
        }

        .suggestion-category {
            display: inline-block;
            margin-bottom: 10px;
            padding: 5px 10px;
            border-radius: 8px;
            background: #334155;
            font-size: 13px;
        }

        .suggestion-text {
            line-height: 1.7;
            color: #e2e8f0;
        }

        .suggestion-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.suggestion-actions button {
    border: none;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
}

.suggestion-delete {
    background: #dc2626;
    color: white;
}

.suggestion-progress {
    background: #d97706;
    color: white;
}

.suggestion-done {
    background: #16a34a;
    color: white;
}

        .empty {
            padding: 30px;
            text-align: center;
            color: #94a3b8;
        }

    </style>

</head>

<body>

<div class="admin-container">

    <div class="admin-header">

        <h1>
            🛡️ لوحة تحكم Mafia Online
        </h1>

        <p>
            معلومات وإحصائيات اللعبة
        </p>

    </div>


    <div class="stats">

        <div class="stat-card">

            <div class="icon">
                👥
            </div>

            <div
                id="totalAccounts"
                class="number"
            >
                0
            </div>

            <div class="label">
                إجمالي الحسابات
            </div>

        </div>


        <div class="stat-card">

            <div class="icon">
                📅
            </div>

            <div
                id="registeredToday"
                class="number"
            >
                0
            </div>

            <div class="label">
                تسجيلات اليوم
            </div>

        </div>


        <div class="stat-card">

            <div class="icon">
                🟢
            </div>

            <div
                id="onlineNow"
                class="number"
            >
                0
            </div>

            <div class="label">
                نشيطون الآن
            </div>

        </div>

    </div>


    <div class="suggestions-section">

        <h2>
            💡 اقتراحات اللاعبين
        </h2>

        <div
            id="suggestionsList"
        ></div>

    </div>

</div>


<script
    src="https://cdn.socket.io/4.8.1/socket.io.min.js"
></script>

<script>

const socket =
    io();


socket.on(
    "connect",
    () => {

        socket.emit(
            "login",
            {
                username:
                    "Admin",

                password:
                    "Hicham@1990"
            }
        );

    }
);

socket.on(
    "loginResult",
    result => {

        if (
            result.success &&
            result.isAdmin
        ) {

            socket.emit(
                "getAdminData"
            );

        }

    }
);


socket.on(
    "adminData",
    data => {

        document
            .getElementById(
                "totalAccounts"
            )
            .textContent =
                data.totalAccounts;

        document
            .getElementById(
                "registeredToday"
            )
            .textContent =
                data.registeredToday;

        document
            .getElementById(
                "onlineNow"
            )
            .textContent =
                data.onlineNow;


        const list =
            document
                .getElementById(
                    "suggestionsList"
                );

        list.innerHTML = "";


        if (
            !data.suggestions ||
            data.suggestions.length === 0
        ) {

            list.innerHTML =
                `
                <div class="empty">
                    لا توجد اقتراحات حاليًا.
                </div>
                `;

            return;
        }


        data.suggestions
            .slice()
            .reverse()
            .forEach(
                suggestion => {

                    const card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        "suggestion-card";

                    const date =
                        new Date(
                            suggestion.date
                        ).toLocaleString(
                            "ar-MA"
                        );


                    card.innerHTML = `

                        <div
                            class="suggestion-header"
                        >

                            <span
                                class="suggestion-user"
                            >
                                👤 ${escapeHtml(
                                    suggestion.username
                                )}
                            </span>

                            <span
                                class="suggestion-date"
                            >
                                ${date}
                            </span>

                        </div>

                        <div
                            class="suggestion-category"
                        >
                            ${getCategoryName(
                                suggestion.category
                            )}
                        </div>

                        <div
                            class="suggestion-text"
                        >
                            ${escapeHtml(
                                suggestion.text
                            )}
                        </div>

                        <div class="suggestion-actions">

    <button
        class="suggestion-delete"
        onclick="handleSuggestionAction('${suggestion.id}', 'delete')"
    >
        🗑️ حذف
    </button>

    <button
        class="suggestion-progress"
        onclick="handleSuggestionAction('${suggestion.id}', 'progress')"
    >
        🔧 في طور التطوير
    </button>

    <button
        class="suggestion-done"
        onclick="handleSuggestionAction('${suggestion.id}', 'done')"
    >
        ✅ تم
    </button>

</div>

                    `;

                    list.appendChild(
                        card
                    );

                }
            );

    }
);

function handleSuggestionAction(
    suggestionId,
    action
) {

    socket.emit(
        "suggestionAction",
        {
            suggestionId,
            action
        }
    );

}


function getCategoryName(
    category
) {

    const categories = {

        gameplay:
            "🎮 طريقة لعب جديدة",

        role:
            "🎭 دور جديد",

        design:
            "🎨 تحسين التصميم",

        bug:
            "🔧 إصلاح مشكل",

        other:
            "💡 فكرة أخرى"

    };

    return (
        categories[category] ||
        "💡 فكرة أخرى"
    );
}


function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;
}

</script>

</body>

</html>
